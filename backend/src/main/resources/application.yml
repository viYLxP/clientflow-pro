spring:
  application:
    name: clientflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clientflow}
    username: ${DB_USERNAME:clientflow}
    password: ${DB_PASSWORD:clientflow}
  jackson:
    deserialization:
      # Treat a missing primitive field (e.g. "active") as its default instead of rejecting the whole request.
      # نعتبر الحقل الأساسي الناقص (مثل "active") بقيمته الافتراضية بدل رفض الطلب كامل.
      fail-on-null-for-primitives: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        # Caps ?size= so a client cannot request millions of rows in one call.
        # يحدّ ?size= حتى ما يطلب العميل ملايين الصفوف في طلب واحد.
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-message: never

clientflow:
  jwt:
    # Must be at least 32 characters. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-0123456789}
    expiration: ${JWT_EXPIRATION:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  time-zone: Asia/Riyadh
  seed:
    # Creates demo users and sample data on an empty database.
    enabled: ${SEED_DEMO_DATA:true}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}
    sales-password: ${SALES_PASSWORD:Sales@12345}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
