# Full stack: PostgreSQL + Spring Boot API + Angular (nginx). Run: docker compose up --build
# النظام كامل: PostgreSQL + Spring Boot API + Angular (nginx). التشغيل: docker compose up --build
# Values come from .env (copy .env.example); the defaults below are for local demos only.
# القيم تُقرأ من .env (انسخ .env.example)؛ والقيم الافتراضية تحت للتجربة المحلية فقط.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientflow
      POSTGRES_USER: ${DB_USERNAME:-clientflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clientflow}
    # Published on 127.0.0.1 only, so a DB tool (DBeaver, pgAdmin) on this machine can open it but the network cannot.
    # منشورة على 127.0.0.1 فقط، عشان أداة قاعدة بيانات (DBeaver أو pgAdmin) على نفس الجهاز تفتحها والشبكة ما توصلها.
    ports:
      - '127.0.0.1:${DB_PORT:-5442}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d clientflow']
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/clientflow
      DB_USERNAME: ${DB_USERNAME:-clientflow}
      DB_PASSWORD: ${DB_PASSWORD:-clientflow}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SALES_PASSWORD: ${SALES_PASSWORD:-Sales@12345}
      CLIENT_PASSWORD: ${CLIENT_PASSWORD:-Client@12345}
      # Payments: SANDBOX (built-in test gateway) until real keys are set. / المدفوعات: SANDBOX (بوابة تجريبية) لين تنحط مفاتيح حقيقية.
      CARD_PAYMENT_PROVIDER: ${CARD_PAYMENT_PROVIDER:-SANDBOX}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8082}
      MOYASAR_SECRET_KEY: ${MOYASAR_SECRET_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      TABBY_SECRET_KEY: ${TABBY_SECRET_KEY:-}
      TABBY_MERCHANT_CODE: ${TABBY_MERCHANT_CODE:-}
      TAMARA_API_URL: ${TAMARA_API_URL:-https://api-sandbox.tamara.co}
      TAMARA_API_TOKEN: ${TAMARA_API_TOKEN:-}
      # Client invite links stop working after this. / روابط دعوة العملاء توقف بعد هالمدة.
      INVITE_VALIDITY: ${INVITE_VALIDITY:-7d}
      # Per visitor IP, per 10 minutes. / لكل IP زائر، كل 10 دقائق.
      RATE_LIMIT_INQUIRIES: ${RATE_LIMIT_INQUIRIES:-5}
      RATE_LIMIT_ATTEMPTS: ${RATE_LIMIT_ATTEMPTS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8082}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '${APP_PORT:-8082}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
